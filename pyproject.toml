[project]
name = "jobmate"
version = "0.1.0"
description = "jobMate agent harness MVP (FastAPI delivery layer, Django migration planned)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pywebpush>=2.5.0",
    "google-adk>=2.14.1",
    "psycopg[binary]>=3.3.9",
    "langsmith>=0.15",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=1.8,<2",
]

[project.scripts]
jobmate = "jobmate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]
# spec 004 US4 — Sentry는 선택 연동. 미설치 시 services.sentry가 no-op.
sentry = [
    "sentry-sdk>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["jobmate"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "playwright>=1.65.2",
]
